schema: 1
watch:
  channel: latest
repair:
  dsh_version: 0.2.1-alpha.2
  # This gateway exposes an OpenAI-compatible API. DSH appends
  # /chat/completions to the configured API root.
  provider: deepseek-official
  model: auto
  reasoning_effort: high
  max_output_tokens: 65536
  max_attempts: 4
  start_policy: immediate
  search:
    enabled: false
    model: auto
credentials:
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://ai.anna.tf/v1
  search_base_url: https://ai.anna.tf/v1
budget:
  max_tokens: 100000000
  max_cny: 3
  max_wall_minutes: 180
plugin:
  workspace: .
  package_json: package.json
  profile: web
smoke:
  contract: compatibility/dsh-smoke.yml
gates:
  repository:
    - npm test
    - npm run build
    - npm pack --dry-run
delivery:
  mode: pull-request
