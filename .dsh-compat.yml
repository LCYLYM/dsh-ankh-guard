schema: 1
watch:
  channel: latest
repair:
  dsh_version: 0.1.1-rc.2
  # This gateway exposes an OpenAI-compatible API. DSH appends
  # /chat/completions to the configured API root.
  provider: deepseek-official
  model: glm-5.3-flash
  max_output_tokens: 131072
  start_policy: immediate
  search:
    enabled: false
    model: glm-5.3-flash
credentials:
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.b.ai/v1
  search_base_url: https://api.b.ai/v1
budget:
  max_tokens: 4000000
  max_cny: 3
plugin:
  workspace: .
  package_json: package.json
  profile: web
smoke:
  contract: compatibility/dsh-smoke.yml
gates:
  repository:
    - npm test
    - npm run build
    - npm pack --dry-run
delivery:
  mode: pull-request
