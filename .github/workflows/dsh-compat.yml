name: DSH compatibility guardian

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dsh-compat.yml
      - .dsh-compat.lock.json
      - compatibility/dsh-smoke.yml
      - .github/workflows/dsh-compat.yml

permissions:
  contents: read

jobs:
  guardian:
    uses: LCYLYM/dsh-plugin-compat-guardian/.github/workflows/guardian.yml@637f97543993bb16999c83a1c4fa779131c4c15d
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      guardian_repository: LCYLYM/dsh-plugin-compat-guardian
      guardian_ref: 637f97543993bb16999c83a1c4fa779131c4c15d
      runner: ubuntu-24.04
    secrets:
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
