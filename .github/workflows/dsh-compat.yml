name: DSH compatibility guardian

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dsh-compat.yml
      - .dsh-compat.lock.json
      - compatibility/dsh-smoke.yml
      - .github/workflows/dsh-compat.yml

permissions:
  contents: read

jobs:
  guardian:
    uses: LCYLYM/dsh-plugin-compat-guardian/.github/workflows/guardian.yml@ec5e76805e563725e2d155391ff6732c02b4c8b9
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      guardian_repository: LCYLYM/dsh-plugin-compat-guardian
      guardian_ref: ec5e76805e563725e2d155391ff6732c02b4c8b9
      runner: ubuntu-24.04
    secrets:
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
