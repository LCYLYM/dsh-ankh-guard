name: DSH compatibility guardian

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guardian:
    uses: LCYLYM/dsh-plugin-compat-guardian/.github/workflows/guardian.yml@9e3e6bb86860b5929e54e17ca11e93acc8714a78
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      guardian_repository: LCYLYM/dsh-plugin-compat-guardian
      guardian_ref: 9e3e6bb86860b5929e54e17ca11e93acc8714a78
      runner: ubuntu-24.04
      target_dsh: 0.1.1-rc.1
    secrets:
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
